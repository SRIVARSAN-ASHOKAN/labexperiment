<!DOCTYPE html>
<html>
<head>
	<title>Add Item</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="add-image">

	<h2 class="title">Add Item</h2>

	<div class="note-box">
		<h3>Note:</h3>
		<ul>
			<li>Item name cannot be empty</li>
			<li>Price must be greater than 0</li>
			<li>Quantity must be greater than 0</li>
		</ul>
	</div>

	<div class="form-container">
		<form onsubmit="addItem(); return false;">
			<label>Item Name</label>
			<input type="text" id="name" placeholder="Name of the item "oninput="validateName()">
			<small id="nameError" class="error"></small>

			<label>Price</label>
			<input type="number" id="price" placeholder="Price"oninput="validatePrice()">
			<small id="priceError" class="error"></small>

			<label>Quantity</label>
			<input type="number" id="qty" placeholder="Quantity" oninput="validateQty()">
			<small id="qtyError" class="error"></small>

			<button type="submit">Add Item</button>
		</form>
	</div>

	<div class="center">
		<a href="index.html">Back</a>
	</div>

	<script src="script.js"></script>
</body>
</html>
